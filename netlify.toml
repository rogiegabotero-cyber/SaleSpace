[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # VITE_-prefixed vars are meant to be embedded in the client bundle by Vite,
  # so Netlify's secret scanner flagging them in dist output is a false
  # positive, not a leak — this just tells it to stop blocking the build on
  # that expected condition.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MEASUREMENT_ID,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_GOOGLE_SHEETS_API_KEY,VITE_HYACINTH_API_KEY,VITE_HYACINTH_BASE_URL,VITE_HYACINTH_DAR_TEMPLATE_ID,VITE_HYACINTH_DEPARTMENT_ID"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
